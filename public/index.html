<title>ULTRA Sprint Planner</title>

<style>:root{
--bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F4F5; --ink:#111111; --muted:#5F6066; --line:#E2E2E5;
--accent:#E10F1A; --accent-ink:#FFFFFF; --ok:#1E7B34; --ok-bg:#E6F4EA; --warn:#9A5B00; --warn-bg:#FFF3E0; --bad:#C1121F; --bad-bg:#FDE8E8; --info-bg:#EEF2F7;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif; --r:12px;
color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.app{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px)) 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.brand h1 b{color:var(--accent)}
.brand .who{font-size:12.5px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);cursor:pointer}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--surface)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;font-family:var(--display);font-weight:700;font-size:16px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.weekstep{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.weekstep button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:32px;cursor:pointer;font-size:17px}
.weekstep>div{flex:1;min-width:0}
.weekstep .wk{font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap;display:flex;gap:6px;align-items:center;overflow:hidden}
.weekstep .wkmeta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cyc{display:inline-block;font-family:var(--display);font-weight:700;font-size:13px;padding:1px 6px;border-radius:5px;color:#1a1a1a;white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding-top:14px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.card h2,.card h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px;font-weight:700}
.card h2{font-size:21px}.card h3{font-size:17px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.ico{width:18px;height:18px;flex:0 0 auto;display:block}
.sys{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.03em;color:#fff;padding:3px 7px 3px 5px;border-radius:6px;white-space:nowrap}
.sys .ico{width:16px;height:16px}
.emo{font-size:17px;line-height:1;display:block}
.sys .emo{font-size:14px}
.sysdot{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;color:#fff;flex:0 0 auto}
.lbl{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.lbl button{border:0;background:transparent;cursor:pointer;padding:0 0 0 2px;font-size:13px;line-height:1;color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.addlbl{border:1px dashed var(--line);background:transparent;border-radius:999px;font-size:12px;padding:2px 9px;cursor:pointer;color:var(--muted)}
.boardwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding-bottom:6px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.board{display:grid;grid-template-columns:repeat(7,minmax(148px,1fr));gap:10px;min-width:min-content}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;scroll-snap-align:start}
.col.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dplus{float:right;width:28px;height:28px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:19px;font-weight:700;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.dplus:hover{filter:brightness(1.1)}
.mdn .dplus{order:9;margin-left:auto;width:22px;height:22px;font-size:16px}
.colhead{padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--r) var(--r) 0 0;cursor:pointer}
.colhead .dn{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.04em}
.colhead .dd{font-size:12px;color:var(--muted)}
.colhead .tot{font-size:12px;font-weight:600;margin-top:2px}
.colnote{padding:6px 10px;font-size:12.5px;background:var(--info-bg);border-bottom:1px solid var(--line)}
.colwu{padding:6px 10px;font-size:12px;color:var(--warn);font-style:italic;border-bottom:1px dashed var(--line);cursor:pointer;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.tile:hover{background:var(--surface-2)}
.tile .t1{font-weight:600;font-size:13.5px;line-height:1.25}
.tile .t2{font-size:12px;color:var(--muted);line-height:1.3}
.tile.warn{background:var(--bad-bg)}
.coladd{margin:8px 10px 10px;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:6px;cursor:pointer;color:var(--muted);font-weight:600}
.coladd:hover{color:var(--ink);border-color:var(--ink)}
.day{padding:0;overflow:hidden}
.dayhead{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.dayhead .dn{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em}
.dayhead .dd{font-size:13px;color:var(--muted);flex:1}
.wu{padding:8px 12px;font-size:13.5px;color:var(--warn);font-style:italic;border-bottom:1px dashed var(--line)}
.note{padding:8px 12px;font-size:13.5px;background:var(--info-bg);border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:start;padding:10px 12px;border-bottom:1px solid var(--line)}
.row .txt{min-width:0;overflow-wrap:anywhere}
.row .nm{font-weight:600}
.row .tg{font-family:var(--display);font-weight:700;font-size:19px;color:var(--accent);white-space:nowrap;text-align:right;line-height:1.1}
.row .tg small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted)}
.flags{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flag{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.flag[aria-pressed="true"].done{background:var(--ok);border-color:var(--ok);color:#fff}
.flag[aria-pressed="true"].part{background:var(--warn);border-color:var(--warn);color:#fff}
.flag[aria-pressed="true"].skip{background:var(--bad);border-color:var(--bad);color:#fff}
.flag:disabled{cursor:default}
.minput{width:92px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:var(--surface)}
.fb{padding:10px 12px;background:var(--surface-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.fbsum{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;background:var(--surface);border:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.iconbtn{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:15px;padding:4px 6px;border-radius:6px}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
#side,#sidefab,#sidebg{display:none}
#side{position:fixed;left:0;top:0;bottom:0;width:var(--sidew,256px);z-index:6;flex-direction:column;gap:8px;background:var(--surface);border-right:1px solid var(--line);padding:12px 10px 24px;overflow:auto}
.sideh{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.03em;padding:4px 4px 0}
.sidex{border:0;background:none;font-size:18px;cursor:pointer;display:none}
.sidesec{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 4px 2px}
.sgrow{display:flex;align-items:center;gap:2px}
.sideg,.sidea{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 8px;cursor:pointer;font-weight:700}
.sideg:hover,.sidea:hover{background:var(--surface-2)}
.sideg.on{background:var(--ink);color:var(--surface)}.sidea.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.sideg .cnt{margin-left:auto;font-size:12px;opacity:.7;font-weight:600}
.sideg .gdot{width:10px;height:10px;border-radius:3px;flex:none}
.sidea{font-weight:600;font-size:14px;padding:5px 8px 5px 14px;gap:2px}.sidea small{margin-left:auto;color:var(--muted);font-weight:500}
.sgedit{border:0;background:none;cursor:pointer;padding:6px;border-radius:6px;color:var(--muted)}.sgedit:hover{background:var(--surface-2)}
.sgnote{font-size:11.5px;color:var(--muted);padding:0 8px 4px 26px;margin-top:-2px}
.cgm{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 10px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.cgm label{display:flex;gap:6px;align-items:center;font-size:13.5px}.cgm .why{font-size:11px;color:var(--muted);margin-left:auto}
.cgcol{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}.cgcol[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
@media (min-width:1100px){
body.side{padding-left:calc(var(--sidew,256px) + 16px)}
body.side header.app{margin-left:calc(-1 * (var(--sidew,256px) + 16px));padding-left:calc(var(--sidew,256px) + 32px)}
body.side #side{display:flex}
}
@media (max-width:1099px){
body.side #sidefab{display:flex;align-items:center;justify-content:center;position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
body.side.sideopen #side{display:flex;width:min(310px,86vw);z-index:31;box-shadow:4px 0 24px rgba(0,0,0,.25)}
body.side.sideopen #sidebg{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
.sidex{display:block}
}
.rtxt{white-space:pre-wrap;font-size:13.5px;line-height:1.4;background:var(--surface-2);border-radius:6px;padding:6px 8px;margin-top:4px}
textarea.tinput,#f_txt{width:100%;min-height:96px;resize:vertical;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.rowtop{display:grid;grid-template-columns:minmax(170px,300px) 1fr;gap:10px}@media(max-width:560px){.rowtop{grid-template-columns:1fr}}
.pcinfo{margin-top:6px;background:color-mix(in srgb,var(--ok) 9%,transparent);border-radius:6px;padding:6px 8px;line-height:1.5}.pcinfo:empty{display:none}.pcl{white-space:nowrap}
.tile.sel,.mt.sel{outline:3px solid var(--accent);outline-offset:-2px;background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.col.dsel,.mday.dsel,.gcell.dsel{background:color-mix(in srgb,var(--accent) 10%,transparent);box-shadow:inset 0 0 0 3px var(--accent)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--surface);padding:10px 12px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);width:min(720px,calc(100vw - 24px))}
.selbar .btn{color:var(--ink)}.selbar .btn.primary,.selbar .btn.danger{color:#fff}
body.selmode [data-tile]{cursor:pointer}
body.pastemode [data-drop]{cursor:copy}body.pastemode [data-drop]:hover{box-shadow:inset 0 0 0 3px var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
[data-drop] [data-tile]{touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

.dragghost{position:fixed;z-index:60;pointer-events:none;opacity:.92;box-shadow:0 10px 28px rgba(0,0,0,.3);transform-origin:0 0;border-radius:8px;background:var(--surface)}
.dragsrc{opacity:.35}
.dropph{height:6px;border-radius:3px;background:var(--accent);margin:3px 6px}
[data-drop].dropover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.sw,.field label.sw{display:flex;gap:8px;align-items:center;justify-content:flex-start;font-size:13.5px;font-weight:600;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--ink)}.sw input,.field .sw input{width:auto!important;min-width:0;flex:none;margin:0;padding:0}
.blk{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--surface-2)}.blkh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}.blkh label{display:inline-flex;gap:5px;align-items:center}.blkh input{width:62px}.blkreps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.blrep{display:inline-flex;gap:3px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 6px}.blrep span:first-child{font-size:11px;color:var(--muted);min-width:12px}.blrep input{width:62px;padding:4px 6px}
.caltool{position:sticky;top:calc(var(--hh,110px) + 6px);z-index:4;box-shadow:0 4px 14px rgba(0,0,0,.08)}
@media (max-width:760px){.caltool{padding:6px 8px!important}.caltool .bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px}.caltool .bar::-webkit-scrollbar{display:none}.caltool .bar>*{flex:none}}
.acct{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 8px 2px 3px;font-size:12.5px;cursor:pointer;max-width:260px}.acct img{width:20px;height:20px;border-radius:50%}.acct span:nth-child(2),.acct span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acct .role{background:var(--ink);color:var(--surface);border-radius:999px;padding:0 6px;font-weight:700;font-size:11px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.login{max-width:560px;margin:24px auto;text-align:left}.lgmark{font-size:34px;width:56px;height:56px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center}.lgsteps{padding-left:20px;line-height:1.55;margin:0}.lgsteps li{margin:6px 0}
.pbtag{display:inline-block;background:#2E7D32;color:#fff;border-radius:999px;padding:0 6px;font-size:11px;font-weight:800}
.restab td{vertical-align:middle}.restab input{padding:5px 7px}
#dragtrash{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:59;background:var(--surface);color:var(--bad);border:2px dashed var(--bad);border-radius:14px;padding:16px 28px;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:none;transition:transform .12s,background .12s}#dragtrash.over{background:var(--bad);color:#fff;transform:translateX(-50%) scale(1.08)}
.dlearn{margin:6px 0 0;padding:5px 8px;border-radius:6px;background:color-mix(in srgb,var(--accent) 8%,transparent);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbadge{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:#B3261E;color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px;font-family:var(--body);letter-spacing:0}
.alc{border-left:5px solid var(--line)}.alc.hi{border-left-color:#B3261E}.alc.mid{border-left-color:#E07B24}.alc.info{border-left-color:#7B8BA6}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}

.kpi .v{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}

.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}

.warnpill{display:inline-block;font-size:12px;font-weight:600;color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:1px 6px}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}

body.hasbnav .toast{bottom:calc(76px + var(--nlb))!important}
body.hasbnav::after{content:"";position:fixed;left:0;right:0;bottom:0;height:var(--nlb);background:var(--surface);z-index:24}
}
.sheet{padding-bottom:calc(14px + var(--nlb))!important}.sheet-bg{z-index:45!important}
#bellb{position:relative}
body.wkicons .boardwrap{overflow:visible!important;margin:0!important;padding:0!important;scroll-snap-type:none!important}
body.wkicons .board{display:grid!important;grid-template-columns:repeat(7,minmax(0,1fr))!important;gap:4px!important;width:auto!important}
body.wkicons .col{min-width:0!important;min-height:200px;padding:4px 2px!important;scroll-snap-align:none!important;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
body.wkicons .colhead{text-align:center;padding:0!important;min-height:0!important;border:0!important}
body.wkicons .colhead>*:not(.dn):not(.dd){display:none!important}
body.wkicons .colhead .dn{font-size:15px!important}body.wkicons .colhead .dn .small{display:none}body.wkicons .colhead .dd{font-size:0!important}body.wkicons .colhead .dd::after{content:attr(data-n);font-size:12px;color:var(--muted)}
body.wkicons .tile,body.wkicons .wutile{padding:0!important;border:0!important;background:transparent!important;min-height:0!important;width:auto!important;justify-content:center;box-shadow:none!important}
body.wkicons .tile>span:not(.sysdot),body.wkicons .tile .stmark,body.wkicons .tile>b,body.wkicons .tile>i,body.wkicons .wutile .wtx,body.wkicons .wutile i{display:none!important}
body.wkicons .tile .sysdot,body.wkicons .wutile .sysdot{width:34px!important;height:34px!important;border-radius:9px!important;font-size:16px}
body.wkicons .coladd,body.wkicons .colnote,body.wkicons .boardhint,body.wkicons .wkhead,body.wkicons .dnav{display:none!important}
body.wkicons .col.rest-empty::after{content:"riposo";font-size:10.5px;color:var(--muted)}
.daysheet{display:block!important}.daysheet .col{min-width:0!important;width:100%!important;border:0!important;padding:0!important;box-shadow:none!important}.daysheet .dnav,.daysheet .dplus{display:none!important}
.dshead{display:flex;align-items:center;gap:8px;margin-bottom:8px}.dshead .t{flex:1;text-align:center}.dshead .t b{font-family:var(--display);font-size:22px;text-transform:uppercase;display:block}
.sessbar{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px;margin-bottom:10px}.sessbar .live{width:10px;height:10px;border-radius:50%;background:#2ECC71;box-shadow:0 0 0 4px rgba(46,204,113,.25)}
.stabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;-webkit-overflow-scrolling:touch}.stabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 12px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;min-height:40px;white-space:nowrap}.stabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}.stabs .cnt{font-weight:600;opacity:.75;margin-left:4px}
.srow{padding:9px 0;border-bottom:1px solid var(--line)}.srow:last-child{border-bottom:0}.srow .top{display:flex;align-items:center;gap:8px}.srow .nm{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.srow .ti{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;margin-top:6px}.srow input{width:100%;min-height:44px;font-size:17px;text-align:center;padding:2px;border:1.5px solid var(--line);border-radius:9px}.srow .ti input:placeholder-shown{border-color:color-mix(in srgb,var(--accent) 50%,transparent)}.srow input.m{width:72px}
.srow .nb{min-height:42px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
body.hasbnav #navhomeb{display:none!important}
.spick{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.spick .sp{flex:1;font-weight:700}.spick button{width:52px;min-height:42px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;cursor:pointer}.spick button[aria-pressed=true]{background:color-mix(in srgb,var(--ok) 15%,var(--surface));border-color:var(--ok);color:var(--ok)}
.sessback{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.snote{border-left:3px solid #1565C0;background:color-mix(in srgb,#1565C0 6%,var(--surface));border-radius:6px;padding:6px 10px;margin:6px 0;font-size:14px}.snote small{display:block;color:var(--muted);font-size:11.5px}
.gsec{margin-bottom:12px}.gsec>h3{font-family:var(--display);text-transform:uppercase;font-size:18px;margin:4px 0 8px}
.onb{text-align:center}.onb .ob{font-size:54px;margin:10px 0}.onb .dots{display:flex;gap:6px;justify-content:center;margin:12px 0}.onb .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.onb .dots i.on{background:var(--accent)}</style>

ake.","Sbagli il 100% dei tiri che non fai.","Wayne Gretzky"],["I've failed over and over and over again in my life. And that is why I succeed.","Ho fallito più e più volte nella mia vita. Ed è per questo che ho successo.","Michael Jordan"],["Float like a butterfly, sting like a bee.","Vola come una farfalla, pungi come un'ape.","Muhammad Ali"],["If you want to run, run a mile. If you want to experience a different life, run a marathon.","Se vuoi correre, corri un miglio. Se vuoi vivere un'altra vita, corri una maratona.","Emil Zátopek"],["To give anything less than your best is to sacrifice the gift.","Dare meno del tuo meglio significa sprecare il dono che hai.","Steve Prefontaine"],["Pressure is a privilege.","La pressione è un privilegio.","Billie Jean King"],["If you have a body, you are an athlete.","Se hai un corpo, sei un atleta.","Bill Bowerman"],["Start where you are. Use what you have. Do what you can.","Parti da dove sei. Usa quello che hai. Fai quello che puoi.","Arthur Ashe"],["It's hard to beat a person who never gives up.","È difficile battere chi non si arrende mai.","Babe Ruth"],["Never underestimate the power of dreams and the influence of the human spirit.","Non sottovalutare mai il potere dei sogni e la forza dello spirito umano.","Wilma Rudolph"],["The man who can drive himself further once the effort gets painful is the man who will win.","Vince chi riesce a spingersi oltre quando lo sforzo inizia a far male.","Roger Bannister"],["Success is no accident. It is hard work, perseverance, learning, studying, sacrifice and most of all, love of what you are doing.","Il successo non è un caso: è lavoro duro, perseveranza, studio, sacrificio e soprattutto amore per quello che fai.","Pelé"],["Hard work has made it easy. That is my secret. That is why I win.","Il lavoro duro ha reso tutto facile. È il mio segreto, è per questo che vinco.","Nadia Comăneci"],["Champions aren't made in gyms. Champions are made from something they have deep inside them: a desire, a dream, a vision.","I campioni non nascono in palestra: nascono da qualcosa che hanno dentro, un desiderio, un sogno, una visione.","Muhammad Ali"],["Talent wins games, but teamwork and intelligence win championships.","Il talento vince le partite, ma il lavoro di squadra e l'intelligenza vincono i campionati.","Michael Jordan"],["We all have dreams. But in order to make dreams come into reality, it takes an awful lot of determination, dedication, self-discipline, and effort.","Tutti abbiamo dei sogni, ma per realizzarli servono determinazione, dedizione, autodisciplina e fatica.","Jesse Owens"],["I really think a champion is defined not by their wins but by how they can recover when they fall.","Un campione non si misura dalle vittorie, ma da come si rialza quando cade.","Serena Williams"],["When anyone tells me I can't do anything, I'm just not listening any more.","Quando qualcuno mi dice che non posso fare qualcosa, semplicemente smetto di ascoltare.","Florence Griffith Joyner"],["Ask any athlete: we all hurt at times. The question is, do you play at the level you're capable of while in pain?","Chiedi a qualsiasi atleta: tutti a volte soffriamo. La domanda è se riesci a rendere al tuo livello anche così.","Jackie Joyner-Kersee"],["You can't put a limit on anything. The more you dream, the farther you get.","Non puoi mettere un limite a niente. Più sogni, più lontano arrivi.","Michael Phelps"],["Il bene si fa, ma non si dice.",null,"Gino Bartali"],["La vita è una figata.",null,"Bebe Vio"],["The more you sweat in training, the less you bleed in combat.","Più sudi in allenamento, meno sanguini in battaglia.","Richard Marcinko"],["It's not whether you get knocked down; it's whether you get up.","Non conta se vieni buttato giù, conta se ti rialzi.","Vince Lombardi"],["Mind is everything. Muscle – pieces of rubber. All that I am, I am because of my mind.","La mente è tutto. I muscoli sono pezzi di gomma. Tutto ciò che sono, lo sono grazie alla mente.","Paavo N
