<title>ULTRA Sprint Planner</title>

<style>
/* Layout: phone-first app shell — sticky header (brand, tabs, group + week stepper); coach board = 7 day columns scrolling sideways; athlete view = stacked day cards with check-ins. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F4F5; --ink:#111111; --muted:#5F6066; --line:#E2E2E5;
  --accent:#E10F1A; --accent-ink:#FFFFFF; --ok:#1E7B34; --ok-bg:#E6F4EA; --warn:#9A5B00; --warn-bg:#FFF3E0; --bad:#C1121F; --bad-bg:#FDE8E8; --info-bg:#EEF2F7;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif; --r:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.app{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px)) 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.brand h1 b{color:var(--accent)}
.brand .who{font-size:12.5px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);cursor:pointer}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--surface)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;font-family:var(--display);font-weight:700;font-size:16px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.weekstep{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.weekstep button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:32px;cursor:pointer;font-size:17px}
.weekstep>div{flex:1;min-width:0}
.weekstep .wk{font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap;display:flex;gap:6px;align-items:center;overflow:hidden}
.weekstep .wkmeta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cyc{display:inline-block;font-family:var(--display);font-weight:700;font-size:13px;padding:1px 6px;border-radius:5px;color:#1a1a1a;white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding-top:14px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.card h2,.card h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px;font-weight:700}
.card h2{font-size:21px}.card h3{font-size:17px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.ico{width:18px;height:18px;flex:0 0 auto;display:block}
.sys{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.03em;color:#fff;padding:3px 7px 3px 5px;border-radius:6px;white-space:nowrap}
.sys .ico{width:16px;height:16px}
.emo{font-size:17px;line-height:1;display:block}
.sys .emo{font-size:14px}
.sysdot{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;color:#fff;flex:0 0 auto}
.lbl{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.lbl button{border:0;background:transparent;cursor:pointer;padding:0 0 0 2px;font-size:13px;line-height:1;color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.addlbl{border:1px dashed var(--line);background:transparent;border-radius:999px;font-size:12px;padding:2px 9px;cursor:pointer;color:var(--muted)}
.boardwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding-bottom:6px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.board{display:grid;grid-template-columns:repeat(7,minmax(148px,1fr));gap:10px;min-width:min-content}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;scroll-snap-align:start}
.col.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dplus{float:right;width:28px;height:28px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:19px;font-weight:700;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.dplus:hover{filter:brightness(1.1)}
.mdn .dplus{order:9;margin-left:auto;width:22px;height:22px;font-size:16px}
.colhead{padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--r) var(--r) 0 0;cursor:pointer}
.colhead .dn{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.04em}
.colhead .dd{font-size:12px;color:var(--muted)}
.colhead .tot{font-size:12px;font-weight:600;margin-top:2px}
.colnote{padding:6px 10px;font-size:12.5px;background:var(--info-bg);border-bottom:1px solid var(--line)}
.colwu{padding:6px 10px;font-size:12px;color:var(--warn);font-style:italic;border-bottom:1px dashed var(--line);cursor:pointer;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.tile:hover{background:var(--surface-2)}
.tile .t1{font-weight:600;font-size:13.5px;line-height:1.25}
.tile .t2{font-size:12px;color:var(--muted);line-height:1.3}
.tile.warn{background:var(--bad-bg)}
.coladd{margin:8px 10px 10px;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:6px;cursor:pointer;color:var(--muted);font-weight:600}
.coladd:hover{color:var(--ink);border-color:var(--ink)}
.day{padding:0;overflow:hidden}
.dayhead{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.dayhead .dn{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em}
.dayhead .dd{font-size:13px;color:var(--muted);flex:1}
.wu{padding:8px 12px;font-size:13.5px;color:var(--warn);font-style:italic;border-bottom:1px dashed var(--line)}
.note{padding:8px 12px;font-size:13.5px;background:var(--info-bg);border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:start;padding:10px 12px;border-bottom:1px solid var(--line)}
.row .txt{min-width:0;overflow-wrap:anywhere}
.row .nm{font-weight:600}
.row .tg{font-family:var(--display);font-weight:700;font-size:19px;color:var(--accent);white-space:nowrap;text-align:right;line-height:1.1}
.row .tg small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted)}
.flags{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flag{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.flag[aria-pressed="true"].done{background:var(--ok);border-color:var(--ok);color:#fff}
.flag[aria-pressed="true"].part{background:var(--warn);border-color:var(--warn);color:#fff}
.flag[aria-pressed="true"].skip{background:var(--bad);border-color:var(--bad);color:#fff}
.flag:disabled{cursor:default}
.minput{width:92px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:var(--surface)}
.fb{padding:10px 12px;background:var(--surface-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.fbsum{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;background:var(--surface);border:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.iconbtn{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:15px;padding:4px 6px;border-radius:6px}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}

#side,#sidefab,#sidebg{display:none}
#side{position:fixed;left:0;top:0;bottom:0;width:256px;z-index:6;flex-direction:column;gap:8px;background:var(--surface);border-right:1px solid var(--line);padding:12px 10px 24px;overflow:auto}
.sideh{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.03em;padding:4px 4px 0}

.sidesec{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 4px 2px}
.sgrow{display:flex;align-items:center;gap:2px}
.sideg,.sidea{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 8px;cursor:pointer;font-weight:700}
.sideg:hover,.sidea:hover{background:var(--surface-2)}
.sideg.on{background:var(--ink);color:var(--surface)}.sidea.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.sideg .cnt{margin-left:auto;font-size:12px;opacity:.7;font-weight:600}
.sideg .gdot{width:10px;height:10px;border-radius:3px;flex:none}
.sidea{font-weight:600;font-size:14px;padding:5px 8px 5px 14px;gap:2px}.sidea small{margin-left:auto;color:var(--muted);font-weight:500}
.sgedit{border:0;background:none;cursor:pointer;padding:6px;border-radius:6px;color:var(--muted)}.sgedit:hover{background:var(--surface-2)}
.sgnote{font-size:11.5px;color:var(--muted);padding:0 8px 4px 26px;margin-top:-2px}
.cgm{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 10px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.cgm label{display:flex;gap:6px;align-items:center;font-size:13.5px}.cgm .why{font-size:11px;color:var(--muted);margin-left:auto}
.cgcol{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}.cgcol[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
@media (min-width:1100px){
 body.side{padding-left:272px}
 body.side header.app{margin-left:-272px;padding-left:288px}
 body.side #side{display:flex}
}
@media (max-width:1099px){
 body.side #sidefab{display:flex;align-items:center;justify-content:center;position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
 body.side.sideopen #side{display:flex;width:min(310px,86vw);z-index:31;box-shadow:4px 0 24px rgba(0,0,0,.25)}
 body.side.sideopen #sidebg{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
 .sidex{display:block}
}
.rtxt{white-space:pre-wrap;font-size:13.5px;line-height:1.4;background:var(--surface-2);border-radius:6px;padding:6px 8px;margin-top:4px}
textarea.tinput,#f_txt{width:100%;min-height:96px;resize:vertical;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.rowtop{display:grid;grid-template-columns:minmax(170px,300px) 1fr;gap:10px}@media(max-width:560px){.rowtop{grid-template-columns:1fr}}
.pcinfo{margin-top:6px;background:color-mix(in srgb,var(--ok) 9%,transparent);border-radius:6px;padding:6px 8px;line-height:1.5}.pcinfo:empty{display:none}.pcl{white-space:nowrap}

.tile.sel,.mt.sel{outline:3px solid var(--accent);outline-offset:-2px;background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.col.dsel,.mday.dsel,.gcell.dsel{background:color-mix(in srgb,var(--accent) 10%,transparent);box-shadow:inset 0 0 0 3px var(--accent)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--surface);padding:10px 12px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);width:min(720px,calc(100vw - 24px))}
.selbar .btn{color:var(--ink)}.selbar .btn.primary,.selbar .btn.danger{color:#fff}
body.selmode [data-tile]{cursor:pointer}
body.pastemode [data-drop]{cursor:copy}body.pastemode [data-drop]:hover{box-shadow:inset 0 0 0 3px var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
[data-drop] [data-tile]{touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

.dragghost{position:fixed;z-index:60;pointer-events:none;opacity:.92;box-shadow:0 10px 28px rgba(0,0,0,.3);transform-origin:0 0;border-radius:8px;background:var(--surface)}
.dragsrc{opacity:.35}
.dropph{height:6px;border-radius:3px;background:var(--accent);margin:3px 6px}
[data-drop].dropover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.sw,.field label.sw{display:flex;gap:8px;align-items:center;justify-content:flex-start;font-size:13.5px;font-weight:600;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--ink)}.sw input,.field .sw input{width:auto!important;min-width:0;flex:none;margin:0;padding:0}
.blk{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--surface-2)}.blkh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}.blkh label{display:inline-flex;gap:5px;align-items:center}.blkh input{width:62px}.blkreps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.blrep{display:inline-flex;gap:3px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 6px}.blrep span:first-child{font-size:11px;color:var(--muted);min-width:12px}.blrep input{width:62px;padding:4px 6px}

a.btn{text-decoration:none;display:inline-flex;align-items:center}
.login{max-width:560px;margin:24px auto;text-align:left}.lgmark{font-size:34px;width:56px;height:56px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center}.lgsteps{padding-left:20px;line-height:1.55;margin:0}.lgsteps li{margin:6px 0}
.pbtag{display:inline-block;background:#2E7D32;color:#fff;border-radius:999px;padding:0 6px;font-size:11px;font-weight:800}
.restab td{vertical-align:middle}.restab input{padding:5px 7px}
#dragtrash{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:59;background:var(--surface);color:var(--bad);border:2px dashed var(--bad);border-radius:14px;padding:16px 28px;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:none;transition:transform .12s,background .12s}#dragtrash.over{background:var(--bad);color:#fff;transform:translateX(-50%) scale(1.08)}

.tbadge{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:#B3261E;color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px;font-family:var(--body);letter-spacing:0}
.alc{border-left:5px solid var(--line)}.alc.hi{border-left-color:#B3261E}.alc.mid{border-left-color:#E07B24}.alc.info{border-left-color:#7B8BA6}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.kpi .v{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted)}

.progress i{display:block;height:100%;background:var(--ok)}
.warnpill{display:inline-block;font-size:12px;font-weight:600;color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:1px 6px}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}

function trendSVG(aid){const [,l]=logOfAth(aid);const pts=[];if(l?.entries){for(const [wk,e] of Object.entries(l.entries)){const w=parseInt(wk.slice(1),10);for(const [d,dl] of Object.entries(e.days||{})){const x=(w-1)*7+DAYS.indexOf(d);const p=isNum(dl.pain?.v)?dl.pain.v:null,r=isNum(dl.rpe)?dl.rpe:null;if(p!=null||r!=null)pts.push({x,p,r})}}}

const ALDEF={win:10,skipN:3,missN:3,rpeHi:8,rpeHiN:3,rpeLo:3,rpeLoN:3,feelLo:2,feelLoN:2,painHi:5,painRep:3,volPct:60};

function alertsFor(aid){const C=alCfg();const D=alertDays(aid,C.win);const A=[];const ds=x=>DAYS_S(x);

  if(nc.length>=C.skipN){const sk=nc.filter(x=>x.rows.some(y=>y.st?.s==="skip")).length;const last=nc[nc.length-1];
    A.push({k:"skip-"+isoD(last.dt),sev:nc.length>=C.skipN+2||sk>=C.skipN+1?"hi":"mid",ic:"⚠️",t:`${nc.length} allenamenti non completati in ${C.win} giorni`,d:nc.map(x=>`${ds(x)} ${x.rows.some(y=>y.st?.s==="skip")?"✕":"½"} ${x.rows.filter(y=>y.st?.s==="skip"||y.st?.s==="part").map(y=>y.r.name).slice(0,2).join(", ")}`).join(" · "),dt:last.dt})}

  const one=B.length===1?B[0]:null;
  if(one&&one.u==="m"&&(!one.sys||one.sys===sys)&&!one.nm&&one.reps.every(x=>x===one.reps[0])){return {sets:one.sets>1?one.sets:null,reps:one.reps.length,dist:one.reps[0],pct:one.pct??null,rec:one.rec??null,recs:one.recs??null,mtot:null,segs:null,segp:null,segl:null,stot:null,blocks:B}}

function sysOfText(s){const d=dictSys(s);if(d)return d;for(const [re,k] of SYSKW)if(re.test(s))return k;return null}
function blkImport(text,rowSys){const out={blocks:[],name:null,head:[]};let alt=false;let pend=[];
  const applyTo=()=>pend.length?pend:(out.blocks.length?[out.blocks[out.blocks.length-1]]:[]);
  for(let line of String(text||"").split("\n")){line=line.trim();if(!line)continue;
    if(/^altern/i.test(line)){alt=true;line=line.replace(/^altern\w*\s*:?\s*/i,"");if(!line)continue}
    const pm=line.match(/@\s*(\d{2,3})(?:\s*%?\s*(?:[-–\/]|to|a)\s*(\d{2,3}))?\s*%?/i);
    const isRec=/^(r\b|r'|rec\b|recupero|rest\b)/i.test(line)&&!/\d+\s*[x×]/i.test(line);
    const isPct=!isRec&&/^@/.test(line)&&!/\d+\s*[x×]/i.test(line);
    if(isRec||isPct){const tg=applyTo();if(pm)for(const b of tg)b.pct=(+pm[1])/100;
      if(isRec){let rs=line.replace(/^(r|rec|recupero|rest)\s*[':.]?\s*/i,"").replace(/@.*$/,"").trim();const x=recParse(rs);const sl=rs.match(/^(.+?)\s*\/\s*(.+)$/);
        for(const b of tg){if(x!=null){b.rec=x;delete b.rq}else if(sl&&recParse(sl[1])!=null){b.rec=recParse(sl[1]);if(recParse(sl[2])!=null)b.recs=recParse(sl[2])}else b.rq=/quantum|q\.?\s?s\b|sufficit|piacere|complet/i.test(rs)?"q.s.":rs.replace(/["″]+$/,"")}}
      pend=[];continue}
    const sys=sysOfText(line)||rowSys||null;const rr=line.match(/^\s*(\d+)(?:\s*[-\/]\s*\d+)?\s*[x×](?!\s*[\d(])/i);if(rr){const nm0=line.replace(/^\s*\d+(?:\s*[-\/]\s*\d+)?\s*[x×]\s*/i,"").trim();const b={sets:1,reps:Array(Math.min(30,+rr[1])).fill(1),u:"r",sys:sys||undefined,nm:nm0||undefined,alt:alt||undefined};out.blocks.push(b);pend.push(b);alt=false;continue}
    const P=parseContent(line,sys);
    const nm=line.replace(/(?:\d+(?:\s*[-\/]\s*\d+)?\s*[x×]\s*)+(\([^)]*\)|\d+(?:[.,]\d+)?(?:\s*[-\/]\s*\d+)*)(\s*(?:m|mt|metri)\b)?/ig," ").replace(/\b\d+(?:\s*m\b)?(?:\s*[-\/]\s*\d+(?:\s*m\b)?)+/ig," ").replace(/\b\d+(?:[.,]\d+)?\s*(?:m|mt|metri)\b/ig," ").replace(/@\s*\d+\s*%?(?:\s*[-–]\s*\d+\s*%?)?|\b\d{2,3}\s*%/g," ").replace(/\b(?:r|rec|recupero)\b\s*[':′.]?\s*\d[^\s]*(?:\s*\/\s*\d[^\s]*)?/ig," ").replace(/["″]/g," ").replace(/\s*\+\s*/g," ").replace(/^[\s,;:·-]+|[\s,;:·-]+$/g,"").replace(/\s{2,}/g," ").trim();
    if(P.tot>0){for(const pb of (P.blocks||[])){const b={sets:pb.sets,reps:pb.reps,u:"m",sys:sys||undefined,nm:nm||undefined,pct:P.pct??undefined,rec:P.rec??undefined,recs:P.recs??undefined,alt:alt||undefined};out.blocks.push(b);pend.push(b)}alt=false;continue}
    if(P.stot>0){const b={sets:1,reps:P.ssegs.slice(0,30),u:"s",sys:sys||undefined,nm:nm||undefined,pct:P.pct??undefined,rec:P.rec??undefined,alt:alt||undefined};out.blocks.push(b);pend.push(b);alt=false;continue}
    out.head.push(line);if(!out.name&&!/,/.test(line)&&!/^@/.test(line)&&!/:\s*$/.test(line))out.name=line}
  return out}

function monthBand(WS,xOf,bw,gap,top,bot,yb,lines){let s="";const grp=[];for(let i=0;i<WS.length;i++){const d=dateOf(WS[i],3);const k=d.getFullYear()*12+d.getMonth();if(!grp.length||grp[grp.length-1].k!==k)grp.push({k,d,i0:i,i1:i});else grp[grp.length-1].i1=i}

    const show=x1-x0>=22;const lab=MESI[m.d.getMonth()]+(m.d.getMonth()===0||(show&&!grp.yr)?" "+String(m.d.getFullYear()).slice(2):"");if(show)grp.yr=1;if(show)s+=`<text x="${(x0+x1)/2}" y="${yb+14}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${lab}</text>`;
    if(lines&&j>0)s+=`<line x1="${x0}" x2="${x0}" y1="${top}" y2="${yb+20}" stroke="var(--muted)" stroke-dasharray="3 3" opacity=".55"/>`});return s}

function seasonBounds(y){if(y==null)y=seasonOfWeek(S.week||currentWeek());return [new Date(y,9,1,12),new Date(y+1,8,30,12),y]}
function seasonWeeks(g){const [a,b]=seasonBounds();const out=[];for(let w=1;w<=NW;w++){if(dateOf(w,6)<a||dateOf(w,0)>b)continue;if(String(cycAt(g,w)||"").startsWith("INTRO"))continue;out.push(w)}return out}
function seasonComps(aid){const a=S.athletes[aid];const l=logFor(aid);const out=[];const [A,B]=seasonBounds();
  for(let w=1;w<=NW;w++){if(dateOf(w,6)<A||dateOf(w,0)>B)continue;const k=planKey(aid,w);for(const r of (weekDoc(w,k).rows||[])){if(r.sys!=="GARA")continue;const st=rowStatus(l,w,r.day,r.id);out.push({w,d:r.day,dt:dateOf(w,DAYS.indexOf(r.day)),r,st})}}return out}
function seasonReportHTML(aid,back){const a=S.athletes[aid];const g=grpOf(a?.group||"100");const W=seasonWeeks(g);const [A,B,y]=seasonBounds();
  const T={planM:0,doneM:0,done95:0,plan95:0,nRows:0,nFlag:0,nDone:0,nPart:0,nSkip:0,rpe:[],pain:0,painDays:0,plan:{},done:{},labels:{}};const wk=[];
  for(const w of W){const R=athWeekReport(aid,w);for(const k of ["planM","doneM","done95","plan95","nRows","nFlag","nDone","nPart","nSkip"])T[k]+=R[k];T.rpe.push(...R.rpe);for(const [s,v] of Object.entries(R.plan))T.plan[s]=(T.plan[s]||0)+v;for(const [s,v] of Object.entries(R.done))T.done[s]=(T.done[s]||0)+v;
    for(const dl of Object.values(R.days))if(isNum(dl.pain?.v)&&dl.pain.v>0){T.painDays++;T.pain=Math.max(T.pain,dl.pain.v)}for(const x of R.labels)T.labels[x]=(T.labels[x]||0)+1;wk.push([w,R.planM,R.doneM,R.nFlag])}
  const mx=Math.max(1,...wk.map(x=>Math.max(x[1],x[2])));const bw=14,gp=4;const H=120;const xo=k=>24+k*(bw+gp);const cwx=xo(wk.length)+8;
  let svg=`<svg viewBox="0 0 ${cwx} ${H+62}" width="${cwx}" height="${H+62}" style="display:block" role="img" aria-label="Metri per settimana">`;svg+=monthBand(wk.map(x=>x[0]),xo,bw,gp,4,H,H+36,true);
  wk.forEach(([w,p,d,f],k)=>{const x=xo(k);const hp=p/mx*H,hd=d/mx*H;svg+=`<rect x="${x}" y="${H-hp}" width="${bw}" height="${hp}" fill="var(--line)" rx="2"><title>S${w} · ${dshort(dateOf(w,0))}–${dshort(dateOf(w,6))}: programmati ${fint(p)} m</title></rect>${f?`<rect x="${x+2}" y="${H-hd}" width="${bw-4}" height="${hd}" fill="var(--accent)" rx="2"><title>S${w}: svolti ${fint(d)} m</title></rect>`:""}<text x="${x+bw/2}" y="${H+13}" text-anchor="middle" font-size="9" fill="var(--muted)">${w}</text><text x="${x+bw/2}" y="${H+24}" text-anchor="middle" font-size="7.5" fill="var(--muted)">${dateOf(w,0).getDate()}</text>`});svg+=`</svg>`;
  const C=seasonComps(aid);const best={};let rowsH="";
  for(const c of C){const E=compEvents(c.r);const R=c.st?.res||{};for(const e of E){const x=R[evKey(e)];const dd=evDist(e);const pb=dd?num(a?.pb?.[dd]):null;const isPB=x&&isNum(x.t)&&pb&&x.t<pb;const isSB=x&&isNum(x.t);if(isSB){const k=e.toLowerCase();if(!best[k]||x.t<best[k].t)best[k]={e,t:x.t,dt:c.dt,place:c.r.place}}
    rowsH+=`<tr><td class="l">${dshort(c.dt)}</td><td class="l"><b>${esc(c.r.name||"Gara")}</b><div class="small muted">${esc([c.r.place,c.r.lvl].filter(Boolean).join(" · "))}</div></td><td class="l">${esc(e)}</td><td class="num"><b>${x?(isNum(x.t)?fmtT(x.t):esc(x.v||"")):"–"}</b>${isPB?' <span class="pbtag">PB</span>':""}</td><td class="num">${x?.pos?esc(String(x.pos))+"°":""}</td><td class="num">${esc(x?.wind||"")}</td><td class="l small">${esc(x?.n||"")}${isPB&&S.canWrite?` <button class="btn ghost" data-pbset="${esc(aid)}|${dd}|${x.t}" title="Aggiorna il PB nel profilo">Aggiorna PB</button>`:""}</td></tr>`}}
  const sys=[...SC,...SCX].filter(s=>T.plan[s]||T.done[s]);const smx=Math.max(1,...sys.map(s=>Math.max(T.plan[s]||0,T.done[s]||0)));
  return `<section class="card">${back?`<button class="btn ghost" data-act="repback">‹ Report gruppo</button>`:""}${repModeSeg()}<h2 style="margin-top:6px">${esc(a?.name||"")} · stagione ${y}/${String(y+1).slice(2)}</h2>
  <p class="small muted" style="margin:0">Dal ${dshort(A)} ${y} al ${dshort(B)} ${y+1}, esclusa l'introduzione · ${W.length} settimane${W.length?` (S${W[0]}–S${W[W.length-1]})`:""}${isAK(planKey(aid,W[0]||1))?"":" · cicli del gruppo "+esc(g)}</p>
  <div class="kpis" style="margin-top:10px"><div class="kpi"><div class="v num">${fint(T.doneM)}<span class="small muted"> / ${fint(T.planM)} m</span></div><div class="l">metri svolti / programmati</div></div><div class="kpi"><div class="v num">${fint(T.done95)}</div><div class="l">metri ≥95% svolti</div></div>
  <div class="kpi"><div class="v num">${T.nRows?Math.round(T.nDone/T.nRows*100):0}%</div><div class="l">allenamenti completati (${T.nDone}/${T.nRows} · ${T.nSkip} saltati)</div></div><div class="kpi"><div class="v num">${T.rpe.length?fx(T.rpe.reduce((x,y)=>x+y,0)/T.rpe.length,1):"–"}</div><div class="l">RPE medio</div></div>

  ${Object.keys(T.labels).length?`<div class="chips" style="margin-top:8px">${Object.entries(T.labels).map(([x,n])=>lblChip(x)+`<span class="small muted">×${n}</span>`).join(" ")}</div>`:""}</section>
  <section class="card"><h3>🏁 Gare della stagione</h3>${Object.keys(best).length?`<div class="chips" style="margin-bottom:8px">${Object.values(best).map(b=>`<span class="pill">SB ${esc(b.e)}: <b>${fmtT(b.t)}</b> <span class="small muted">${dshort(b.dt)}</span></span>`).join("")}</div>`:""}
  ${C.length?`<div class="tablewrap"><table><thead><tr><th class="l">Data</th><th class="l">Manifestazione</th><th class="l">Gara</th><th>Risultato</th><th>Pos.</th><th>Vento</th><th class="l">Note</th></tr></thead><tbody>${rowsH}</tbody></table></div>`:'<p class="small muted">Nessuna gara in calendario: aggiungile con il + sul giorno → 🏁 Gara.</p>'}</section>
  <section class="card"><h3>Metri per settimana</h3><div class="tablewrap" style="border:0">${svg}</div><div class="legend"><span><i style="background:var(--line)"></i>programmati</span><span><i style="background:var(--accent)"></i>svolti</span><span>sotto: n° settimana, giorno del lunedì e mese</span></div></section>

async function selDelete(){const by={};const add=(g,w)=>{const id=g+"|"+w;if(!by[id])by[id]={g,w:+w,rids:new Set(),days:new Set()};return by[id]};
  for(const k of S.sel.rows){const p=k.split("|");const rid=p.pop(),w=p.pop(),g=p.join("|");add(g,w).rids.add(rid)}
  for(const k of S.sel.days){const p=k.split("|");const d=p.pop(),w=p.pop(),g=p.join("|");add(g,w).days.add(d)}
  let n=0;for(const x of Object.values(by)){const doc=clone(weekDoc(x.w,x.g));const before=(doc.rows||[]).length;doc.rows=(doc.rows||[]).filter(r=>!x.rids.has(r.id)&&!x.days.has(r.day));n+=before-doc.rows.length;

/* PAF corta e aerobico sono un unico sistema (AER) */
function normSys(doc){try{if(!doc||!Array.isArray(doc.rows)||!doc.rows.some(r=>r&&(r.sys==="PAFC"||(Array.isArray(r.blocks)&&r.blocks.some(b=>b&&b.sys==="PAFC")))))return doc;const d=JSON.parse(JSON.stringify(doc));for(const r of d.rows){if(r.sys==="PAFC")r.sys="AER";if(Array.isArray(r.blocks))for(const b of r.blocks)if(b.sys==="PAFC")b.sys="AER"}return d}catch(e){return doc}}

const DTYPES=[["stim","Stimolo"],["tool","Strumento (il numero non sono metri)"],["abbr","Abbreviazione"]];
function dictList(){return Array.isArray(S.cfg?.dict)?S.cfg.dict.filter(x=>x&&x.t):[]}
function dictSys(s){s=" "+String(s||"").toLowerCase()+" ";let best=null;for(const x of dictList()){if(!x.sys)continue;const k=String(x.t).toLowerCase().trim();if(!k)continue;if(s.includes(k)&&(!best||k.length>best.k.length))best={k,sys:x.sys}}return best?.sys||null}
function dictTools(){return dictList().filter(x=>x.type==="tool").map(x=>String(x.t).toLowerCase().trim()).filter(Boolean)}
function dictStrip(s){let o=String(s||"");for(const k of dictTools()){const re=new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(\\s*[:=]?\\s*\\d+(?:[.,]\\d+)?)?","ig");o=o.replace(re," ")}return o}
function dictAbbr(s){let o=String(s||"");for(const x of dictList()){if(x.type!=="abbr"||!x.rep)continue;const k=String(x.t).trim();if(!k)continue;const re=new RegExp("(^|[^\\p{L}\\d])"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?=$|[^\\p{L}\\d])","giu");o=o.replace(re,(m,a)=>a+x.rep)}return o}

function openDict(i,pre){const x=i!=null?dictList()[i]:{t:pre?.t||"",type:pre?.type||"stim",sys:pre?.sys||"",rep:""};ED={kind:"dict",i};
  openSheet(`<h2>${i!=null?"Modifica parola":"Nuova parola"}</h2><div class="fields"><div class="field" style="grid-column:1/-1"><label for="dc_t">Parola o espressione</label><input id="dc_t" value="${esc(x.t)}" placeholder="es. bouncerun, 1080, acc drills, qs"></div>

  <div class="wq"><label class="flabel" for="w_hrv">HRV del mattino (facoltativo)</label><input id="w_hrv" class="tinput" inputmode="numeric" placeholder="es. 72 ms" value="${v.hrv??""}" style="max-width:160px"></div>

function wellSave(){const v=ED.v;const hrv=num($("#w_hrv")?.value);const well={sh:v.sh,sq:v.sq,doms:v.doms,at:Date.now()};if(isNum(hrv))well.hrv=hrv;const {aid,w,d}=ED;closeSheet();saveDayFor(aid,w,d,{well});toast("Grazie! Benessere salvato")}
function readiness(aid,days=28){const l=logOfAth(aid)[1];const out=[];const t=new Date();t.setHours(12,0,0,0);
  for(let k=days-1;k>=0;k--){const dt=new Date(t);dt.setDate(dt.getDate()-k);const x=wellOf(l,dt);out.push({dt,x,s:wellScore(x)})}
  const v=out.filter(o=>o.s!=null).map(o=>o.s);const mean=v.length?v.reduce((a,b)=>a+b,0)/v.length:null;const sd=v.length>2?Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/(v.length-1)):null;return {out,mean,sd,n:v.length}}
function readinessCard(aid){if(!S.coach)return "";const a=S.athletes[aid];const R=readiness(aid);const last=[...R.out].reverse().find(o=>o.s!=null);
  if(!R.n)return `<section class="card"><h3 style="margin:0">🔋 Readiness · ${esc(a?.name||"")}</h3><p class="small muted" style="margin:6px 0 0">Nessun questionario del mattino negli ultimi 28 giorni.${logOfAth(aid)[0]?"":" L'atleta non è ancora collegato all'app."}</p></section>`;
  const W=560,H=120,pl=28,pr=8,X=i=>pl+i*(W-pl-pr)/(R.out.length-1),Y=s=>8+(100-s)/100*(H-16);
  let pts="",dots="";R.out.forEach((o,i)=>{if(o.s==null)return;pts+=`${pts?"L":"M"}${X(i).toFixed(1)},${Y(o.s).toFixed(1)}`;const dev=R.mean!=null?o.s-R.mean:0;const c=dev<=-15?"var(--bad)":dev<=-7?"var(--warn)":"var(--ok)";
    dots+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(o.s).toFixed(1)}" r="3.5" fill="${c}"><title>${dshort(o.dt)} · readiness ${o.s} · sonno ${o.x.sh??"–"} h, qualità ${o.x.sq??"–"}/5, DOMS ${o.x.doms??"–"}/5${isNum(o.x.hrv)?", HRV "+o.x.hrv:""}</title></circle>`});
  const ym=R.mean!=null?Y(R.mean):null;
  const svg=`<svg viewBox="0 0 ${W} ${H+18}" width="100%" style="max-width:${W}px;display:block" role="img" aria-label="Readiness ultimi 28 giorni">${[0,50,100].map(s=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(s)}" y2="${Y(s)}" stroke="var(--line)"/><text x="${pl-4}" y="${Y(s)+3}" font-size="9" text-anchor="end" fill="var(--muted)">${s}</text>`).join("")}
    ${ym!=null?`<line x1="${pl}" x2="${W-pr}" y1="${ym}" y2="${ym}" stroke="var(--ink)" stroke-dasharray="4 3"/><text x="${W-pr}" y="${ym-4}" font-size="9" text-anchor="end" fill="var(--ink)">media personale ${Math.round(R.mean)}</text>`:""}
    <path d="${pts}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>${dots}${R.out.map((o,i)=>i%7===0?`<text x="${X(i)}" y="${H+14}" font-size="9" text-anchor="middle" fill="var(--muted)">${dshort(o.dt)}</text>`:"").join("")}</svg>`;
  const dev=last&&R.mean!=null?Math.round(last.s-R.mean):null;
  const rows=R.out.slice(-7).reverse().map(o=>`<tr data-goday="${esc(aid)}|${rawWeek(o.dt)}|${DAYS[(o.dt.getDay()+6)%7]}" style="cursor:pointer" title="Apri il programma di questo giorno"><td class="l">${DAYFULL[(o.dt.getDay()+6)%7].slice(0,3)} ${dshort(o.dt)} <span class="golink">›</span></td><td class="num">${o.x?.sh??"–"}</td><td>${o.x?.sq?SQE[o.x.sq-1]+" "+o.x.sq:"–"}</td><td>${o.x?.doms?DME[o.x.doms-1]+" "+o.x.doms:"–"}</td><td class="num">${o.x?.hrv??"–"}</td><td class="num"><b>${o.s??"–"}</b></td></tr>`).join("");
  return `<section class="card"><div class="bar" style="margin:0;justify-content:space-between"><h3 style="margin:0">🔋 Readiness · ${esc(a?.name||"")}</h3>${last?`<span class="pill" style="font-weight:700;color:${dev<=-15?"var(--bad)":dev<=-7?"var(--warn)":"var(--ok)"}">ultimo ${last.s}${dev!=null?` · ${dev>=0?"+":""}${dev} vs media`:""}</span>`:""}</div>
  <p class="small muted" style="margin:4px 0 8px">Questionario del mattino (sonno, qualità, DOMS, HRV). Si legge come scostamento dalla <b>media personale</b>: verde normale, arancio −7, rosso −15 o peggio. Solo staff.</p>${svg}
  <div class="tablewrap" style="margin-top:8px"><table><thead><tr><th class="l">Giorno</th><th>Sonno h</th><th>Qualità</th><th>DOMS</th><th>HRV</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}
function wellAlerts(aid,A){const R=readiness(aid,14);const rec=R.out.filter(o=>o.s!=null);if(!rec.length)return;const last=rec[rec.length-1];
  if(last.x.doms>=4)A.push({k:"doms-"+isoD(last.dt),sev:last.x.doms>=5?"hi":"mid",ic:"🦵",t:`DOMS ${DML[last.x.doms-1].toLowerCase()} (${last.x.doms}/5)`,d:`questionario del ${dshort(last.dt)}`,dt:last.dt});
  const sl=rec.slice(-3).filter(o=>isNum(o.x.sh)&&o.x.sh<6);if(sl.length>=2)A.push({k:"sleep-"+isoD(last.dt),sev:"mid",ic:"🌙",t:`Poco sonno: ${sl.length} notti sotto le 6 ore`,d:sl.map(o=>`${dshort(o.dt)} ${o.x.sh} h`).join(" · "),dt:last.dt});
  if(R.mean!=null&&R.n>=5&&last.s<=R.mean-15)A.push({k:"ready-"+isoD(last.dt),sev:"hi",ic:"🔋",t:`Readiness bassa: ${last.s} (media ${Math.round(R.mean)})`,d:`questionario del ${dshort(last.dt)} · sonno ${last.x.sh??"–"} h, qualità ${last.x.sq}/5, DOMS ${last.x.doms}/5`,dt:last.dt})}

function athTodos(){const aid=myAthId();if(!aid||S.coach)return [];const l=myLog();const out=[];const now=new Date();const {w:tw,d:td}=todayWD();
  if(!dayLog(l,tw,td)?.well)out.push({ic:"☀️",t:"Come stai stamattina?",s:"Compila il benessere · 20 secondi",act:`data-act="well"`});
  for(let k=0;k<3;k++){const dt=new Date(now);dt.setDate(dt.getDate()-k);const {w,d}=wdOf(dt);const rows=(weekDoc(w,planKey(aid,w)).rows||[]).filter(r=>r.day===d&&r.sys&&!["REST","TER","GARA"].includes(r.sys));if(!rows.length)continue;
    const dl=dayLog(l,w,d);if(isNum(dl?.rpe)||dl?.att==="a")continue;if(k===0&&now.getHours()<17)continue;

function quoteHTML(){const [q,t,a]=quoteToday();return `<figure class="quote noprint"><blockquote>“${esc(q)}”</blockquote>${t?`<div class="qt">${esc(t)}</div>`:""}<figcaption>— ${esc(a)}</figcaption></figure>`}

/* ---- chat atleta ↔ staff (nel documento log dell'atleta) ---- */
function chatMsgs(l){return Object.entries(l?.msgs||{}).map(([id,m])=>({id,...m})).filter(m=>m&&m.x).sort((a,b)=>a.t-b.t)}
function chatUnread(u,side){const l=u?S.logs[u]:null;if(!l)return 0;const seen=l.seen?.[side]||0;return chatMsgs(l).filter(m=>m.f!==side&&m.t>seen).length}
function staffUnread(){if(!S.coach)return 0;let n=0;for(const [u,l] of Object.entries(S.logs||{}))if(l?.athlete&&!u.startsWith("ath-"))n+=chatUnread(u,"s");return n}
function chatUid(aid){return S.coach?logOfAth(aid)[0]:S.uid}
function chatListHTML(aid){const u=chatUid(aid);const M=chatMsgs(u?S.logs[u]:null);const me=S.coach?"s":"a";
  if(!M.length)return `<div class="empty small" style="padding:20px;text-align:center">${S.coach?"Nessun messaggio. Scrivi tu per primo.":"Scrivi qui a coach e terapisti: rispondono appena possono."}</div>`;
  let lastD="";return M.map(m=>{const dt=new Date(m.t);const dd=dshort(dt);const sep=dd!==lastD?`<div class="chatday">${dd}</div>`:"";lastD=dd;
    return sep+`<div class="msg ${m.f===me?"me":"them"}"><div class="mb">${esc(m.x)}</div><div class="mm">${m.f==="s"?esc(m.n||"Staff"):(S.coach?esc(m.n||""):"Tu")} · ${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}</div></div>`}).join("")}
function chatSeen(aid){const u=chatUid(aid);if(!u||!S.logs[u])return;const side=S.coach?"s":"a";if(!chatUnread(u,side))return;savePatchLog(u,aid,{seen:{[side]:Date.now()}})}
function openChat(aid){aid=aid||myAthId();if(!aid){toast("Profilo non ancora collegato");return}const a=S.athletes[aid];ED={kind:"chat",aid};
  openSheet(`<h2>${S.coach?`${emoTag(aid)} ${esc(a?.name||"")}`:"💬 Messaggi allo staff"}</h2>${S.coach&&!chatUid(aid)?'<div class="banner">Questo atleta non è ancora collegato all\'app: potrà leggere i messaggi dopo il collegamento in Accessi.</div>':""}
  <div class="chatlist" id="chatlist">${chatListHTML(aid)}</div>
  <div class="chatin"><textarea id="chat_t" class="tinput" rows="2" placeholder="Scrivi un messaggio…"></textarea><button class="btn primary" data-act="chatsend" ${chatUid(aid)?"":"disabled"}>Invia</button></div>
  <div class="actions">${S.coach?`<button class="btn ghost" data-act="inbox">‹ Tutte le chat</button>`:""}<button class="btn ghost" data-sheet="close">Chiudi</button></div>`);
  const cl=$("#chatlist");if(cl)cl.scrollTop=cl.scrollHeight;chatSeen(aid)}
function chatSend(){const t=$("#chat_t");const x=(t?.value||"").trim();if(!x||ED?.kind!=="chat")return;const aid=ED.aid;const u=chatUid(aid);if(!u){toast("Atleta non ancora collegato");return}
  const id="m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const side=S.coach?"s":"a";const nm=S.coach?(S.me?.name||"Staff"):(S.athletes[aid]?.name||"");
  t.value="";savePatchLog(u,aid,{msgs:{[id]:{t:Date.now(),f:side,n:nm,x:x.slice(0,2000)}},seen:{[side]:Date.now()}})}
function chatRefresh(){if(ED?.kind!=="chat")return;const cl=$("#chatlist");if(!cl)return;const atB=cl.scrollHeight-cl.scrollTop-cl.clientHeight<40;const h=chatListHTML(ED.aid);if(cl.innerHTML!==h){cl.innerHTML=h;if(atB)cl.scrollTop=cl.scrollHeight;setTimeout(()=>chatSeen(ED?.aid),300)}}
function openInbox(){ED={kind:"inbox"};const L=[];for(const [u,l] of Object.entries(S.logs||{})){if(!l?.athlete||u.startsWith("ath-")||!S.athletes[l.athlete])continue;const M=chatMsgs(l);L.push({aid:l.athlete,u,last:M[M.length-1]||null,un:chatUnread(u,"s")})}
  L.sort((a,b)=>(b.un-a.un)||((b.last?.t||0)-(a.last?.t||0))||S.athletes[a.aid].name.localeCompare(S.athletes[b.aid].name));

/* in campo: presenze del giorno */
function fieldDay(){const ti=todayIdx(S.week);if(S.fdi==null||S.fdi<0||S.fdi>6)S.fdi=ti>=0?ti:0;return DAYS[S.fdi]}
function fieldList(){const list=S.fAll?athletesOf(null):athletesOf(S.group);return list.sort((x,y)=>x[1].name.localeCompare(y[1].name))}
function dayRowsOf(aid,w,d){return (weekDoc(w,planKey(aid,w)).rows||[]).filter(r=>r.day===d&&r.sys&&r.sys!=="REST")}
function attOf(aid,w,d){const dl=dayLog(logFor(aid),w,d);if(dl?.att)return dl.att;const rs=dayRowsOf(aid,w,d);if(rs.some(r=>dl?.rows?.[r.id]?.s&&dl.rows[r.id].s!=="skip"))return "p";if(rs.length&&rs.every(r=>dl?.rows?.[r.id]?.s==="skip"))return "a";return null}
function viewField(){const w=S.week,d=fieldDay(),di=DAYS.indexOf(d);const L=fieldList();const g=S.group;const rows=(weekDoc(w,g).rows||[]).map((r,i)=>[r,i]).filter(([r])=>r.day===d);
  let np=0,na=0,nn=0;const items=L.map(([aid,a])=>{const rs=dayRowsOf(aid,w,d);const at=attOf(aid,w,d);if(!rs.length)return {aid,a,rs,at,rest:true};if(at==="p")np++;else if(at==="a")na++;else nn++;return {aid,a,rs,at}});
  let h=`<section class="card fieldhd"><div class="fhgrid"><button class="navb" data-fday="-1" aria-label="Giorno prima">‹</button><div style="text-align:center"><div class="fdn">${DAYFULL[di]} ${dshort(dateOf(w,di))}${todayIdx(w)===di?' · <span style="color:var(--accent)">oggi</span>':""}</div><div class="small muted">${S.fAll?"Tutti i gruppi":esc(gName(g))} · ${L.length} atleti</div></div><button class="navb" data-fday="1" aria-label="Giorno dopo">›</button></div>
    <div class="seg" role="group" style="margin-top:10px;width:100%"><button style="flex:1" data-fall="0" aria-pressed="${!S.fAll}">${esc(gName(g))}</button><button style="flex:1" data-fall="1" aria-pressed="${!!S.fAll}">Tutti i gruppi</button></div></section>`;
  if(!S.fAll&&rows.length)h+=`<section class="card"><div class="flabel" style="margin-bottom:6px">Lavori di oggi · ${esc(gName(g))}</div>${(weekDoc(w,g).wu?.[d])?wuTile(weekDoc(w,g).wu[d],`data-wuopen="${w}|${d}|${esc(g)}"`):""}${rows.map(([r,i])=>`<button class="frow" data-tile="${esc(g)}|${w}|${i}">${sysDot(r.sys)}<span><b>${esc(r.name||"")}</b><span class="small muted">${esc(readable({...r,txt:null},null,true))}</span></span></button>`).join("")}</section>`;
  h+=`<section class="card"><div class="bar" style="margin:0 0 8px;justify-content:space-between"><div class="flabel">Presenze</div><div class="small"><b style="color:var(--ok)">${np} presenti</b> · <b style="color:var(--bad)">${na} assenti</b> · ${nn} da segnare</div></div><div class="flist">`;
  for(const x of items){h+=`<div class="fath${x.at==="p"?" on":x.at==="a"?" off":""}"><button class="fname" data-fath="${esc(x.aid)}">${emoTag(x.aid)||'<span class="emotag">👤</span>'}<span><b>${esc(x.a.name)}</b><span class="small muted">${x.rest?"riposo":x.rs.length+" lavori"}${athLabels(x.aid,w).length?" · "+esc(athLabels(x.aid,w).join(", ")):""}</span></span></button>
    ${x.rest?"":`<button class="fbtn p" data-fatt="p" data-aid="${esc(x.aid)}" aria-pressed="${x.at==="p"}" aria-label="Presente">✓</button><button class="fbtn a" data-fatt="a" data-aid="${esc(x.aid)}" aria-pressed="${x.at==="a"}" aria-label="Assente">✕</button>`}</div>`}
  h+=`</div>${nn&&S.canWrite?`<button class="btn primary" style="width:100%;margin-top:12px" data-act="fclose">Chiudi la sessione: segna assenti i ${nn} non spuntati</button>`:""}<p class="small muted" style="margin:8px 0 0">✓ presente · ✕ assente: tutti i lavori del giorno diventano “saltato”. Tocca un nome per segnare lavori, tempi e feedback.</p></section>`;
  return h}

function nutriCard(aid,full){const a=S.athletes[aid];const N=nutriOf(aid);const D=dietOf(aid);const E=Object.entries(N?.m||{}).sort((x,y)=>x[0]<y[0]?-1:1);const can=S.nutriRole||S.role==="admin";
  const kg=E.filter(([,v])=>isNum(v.kg));let svg="";if(kg.length>1){const W=520,H=110,mn=Math.min(...kg.map(x=>x[1].kg))-1,mx=Math.max(...kg.map(x=>x[1].kg))+1;const X=i=>30+i*(W-40)/(kg.length-1),Y=v=>8+(mx-v)/(mx-mn)*(H-16);
    svg=`<svg viewBox="0 0 ${W} ${H+16}" width="100%" style="max-width:${W}px;display:block" role="img" aria-label="Andamento del peso"><path d="${kg.map(([,v],i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v.kg).toFixed(1)}`).join("")}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>${kg.map(([d,v],i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v.kg).toFixed(1)}" r="3.5" fill="var(--accent)"><title>${d}: ${v.kg} kg</title></circle>`).join("")}<text x="2" y="${Y(mx-1)+3}" font-size="9" fill="var(--muted)">${(mx-1).toFixed(1)}</text><text x="2" y="${Y(mn+1)+3}" font-size="9" fill="var(--muted)">${(mn+1).toFixed(1)}</text><text x="${X(0)}" y="${H+14}" font-size="9" fill="var(--muted)">${kg[0][0].slice(5)}</text><text x="${X(kg.length-1)}" y="${H+14}" font-size="9" text-anchor="end" fill="var(--muted)">${kg[kg.length-1][0].slice(5)}</text></svg>`}
  const tab=E.length?`<div class="tablewrap"><table><thead><tr><th class="l">Data</th><th>Peso kg</th><th>Grasso %</th><th>Massa magra kg</th><th>kcal</th><th class="l">Note</th></tr></thead><tbody>${E.slice().reverse().map(([d,v])=>`<tr><td class="l">${esc(d.split("-").reverse().join("/"))}</td><td class="num">${v.kg??"–"}</td><td class="num">${v.bf??"–"}</td><td class="num">${v.lm??"–"}</td><td class="num">${v.kcal??"–"}</td><td class="l small">${esc(v.n||"")}</td></tr>`).join("")}</tbody></table></div>`:'<p class="small muted" style="margin:0">Nessuna misura registrata.</p>';
  return `<section class="card"><div class="bar" style="margin:0;justify-content:space-between"><h3 style="margin:0">🥗 Nutrizione · ${esc(a?.name||"")}</h3>${can?`<button class="btn primary" data-act="nutriadd" data-aid="${esc(aid)}">+ Misura</button>`:""}</div>
  ${svg}${tab}<div class="flabel" style="margin-top:12px">Piano alimentare ${D?.at?`<span class="small muted">· aggiornato ${dshort(new Date(D.at))}${D.by?" da "+esc(D.by):""}</span>`:""}</div>
  ${can?`<textarea id="diet_t" class="tinput" rows="6" placeholder="Scrivi qui il piano alimentare: lo vede anche l'atleta.">${esc(D?.text||"")}</textarea><div class="actions" style="margin-top:6px"><button class="btn primary" data-act="dietsave" data-aid="${esc(aid)}">Salva piano</button></div>`:`<div class="rtxt">${D?.text?esc(D.text):'<span class="muted">Nessun piano alimentare.</span>'}</div>`}</section>`}
function openNutriAdd(aid){const t=new Date();const iso=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;ED={kind:"nutri",aid};
  openSheet(`<h2>Nuova misura · ${esc(S.athletes[aid]?.name||"")}</h2><div class="fields"><div class="field"><label for="n_d">Data</label><input id="n_d" type="date" value="${iso}"></div><div class="field"><label for="n_kg">Peso kg</label><input id="n_kg" inputmode="decimal"></div><div class="field"><label for="n_bf">Grasso %</label><input id="n_bf" inputmode="decimal"></div><div class="field"><label for="n_lm">Massa magra kg</label><input id="n_lm" inputmode="decimal"></div><div class="field"><label for="n_kc">kcal giornaliere</label><input id="n_kc" inputmode="numeric"></div><div class="field" style="grid-column:1/-1"><label for="n_n">Note</label><input id="n_n"></div></div>
  <div class="actions"><button class="btn ghost" data-sheet="close">Annulla</button><button class="btn primary" data-act="nutrisave">Salva</button></div>`)}
async function nutriSave(){const aid=ED.aid;const d=$("#n_d").value;if(!d){toast("Serve la data");return}const v={kg:num($("#n_kg").value),bf:num($("#n_bf").value),lm:num($("#n_lm").value),kcal:num($("#n_kc").value),n:$("#n_n").value.trim()||null};for(const k in v)if(v[k]==null)delete v[k];
  closeSheet();const cur=nutriOf(aid);S.nutri=S.nutri||{};const body=cur?deepMerge(clone(cur),{m:{[d]:v}}):{m:{[d]:v}};S.nutri[aid]=body;render();await (cur?queue("nutri/"+aid,()=>S.db.doc("nutri/"+aid).update({m:{[d]:v}})):saveDoc("nutri/"+aid,body));toast("Misura salvata")}
async function dietSave(aid){const t=$("#diet_t")?.value||"";const body={text:t,at:Date.now(),by:S.me?.name||""};S.diet=S.diet||{};S.diet[aid]=body;render();await saveDoc("diet/"+aid,body);toast("Piano alimentare salvato")}
function viewNut(){if(!S.nutriRole&&!S.coach)return "";const L=athletesOf(null).sort((x,y)=>x[1].name.localeCompare(y[1].name));const sel=S.nutSel&&S.athletes[S.nutSel]?S.nutSel:null;
  if(sel)return `<section class="card noprint"><button class="btn ghost" data-nutsel="">‹ Tutti gli atleti</button></section>`+nutriCard(sel,true);
  return `<section class="card"><h2 style="margin:0">🥗 Nutrizione</h2><p class="small muted" style="margin:4px 0 10px">Misure e piano alimentare per atleta. L'atleta vede solo il suo piano alimentare.</p><div class="list">${L.map(([id,a])=>{const E=Object.keys(nutriOf(id)?.m||{}).sort();const last=E[E.length-1];return `<button class="inboxrow" data-nutsel="${esc(id)}">${emoTag(id)||'<span class="emotag">👤</span>'}<span style="flex:1;text-align:left"><b>${esc(a.name)}</b><div class="small muted">${esc(gName(a.group))}${last?" · ultima misura "+last.split("-").reverse().join("/"):" · nessuna misura"}${dietOf(id)?.text?" · piano ✓":""}</div></span><i>›</i></button>`}).join("")}</div></section>`}

/* PDF clinico: cronistoria stampabile (solo staff) */
function viewClin(){const aid=S.clinAid;const a=S.athletes[aid];if(!a)return `<section class="card empty">Atleta non trovato.</section>`;const ev=folderEvents(aid).sort((x,y)=>x.ts-y.ts);const t=new Date();
  let h=`<section class="card noprint"><div class="bar" style="margin:0;justify-content:space-between"><button class="btn ghost" data-act="clinback">‹ Cartella</button><button class="btn primary" data-act="doprint">🖨 Stampa / salva PDF</button></div><p class="small muted" style="margin:8px 0 0">Nel dialogo di stampa scegli <b>Salva come PDF</b>. Contiene dati sanitari: condividilo solo con lo staff e con l'atleta.</p></section>
  <section class="card clin"><div class="clinh"><img src="${$("#navhome img")?.src||""}" alt="ULTRA" style="height:22px"><div><b>Cronistoria clinica</b><div class="small">${esc(a.name)} · ${a.year||""} · gruppo ${esc(gName(a.group))}</div></div><div class="small" style="margin-left:auto;text-align:right">Generata il ${dshort(t)} ${t.getFullYear()}<br>Riservato · dati sanitari</div></div>
  <table class="clint"><thead><tr><th class="l">Data</th><th class="l">Evento</th><th class="l">Dettagli</th></tr></thead><tbody>`;
  for(const e of ev){const dt=`${DAYFULL[DAYS.indexOf(e.d)].slice(0,3)} ${dshort(e.dt)} ${e.dt.getFullYear()}`;
    if(e.k==="pain")h+=`<tr><td class="l">${dt}</td><td class="l"><b>${e.v>0?"Dolore "+e.v+"/10":"Nessun dolore"}</b></td><td class="l">${esc([e.area,e.side].filter(Boolean).join(" "))}${isNum(e.rpe)?" · RPE "+e.rpe:""}${e.sess?" · allenamento: "+esc(e.sess):""}${e.note?` · “${esc(e.note)}”`:""}</td></tr>`;
    else if(e.k==="treat")h+=`<tr><td class="l">${dt}</td><td class="l"><b>Trattamento</b></td><td class="l">${treatHTML(e.x)}</td></tr>`;
    else h+=`<tr><td class="l">${dt}</td><td class="l"><b>${esc(e.lb)}</b></td><td class="l">${e.week?"etichetta per tutta la settimana":"etichetta del giorno"}</td></tr>`}
  if(!ev.length)h+=`<tr><td colspan="3" class="l muted">Nessun evento registrato.</td></tr>`;
  return h+`</tbody></table></section>`}

function dietSub(){if(S.coach||S.nutriRole||!S.db||S.noDb)return;const aid=myAthId();if(!aid||S._dietA===aid)return;S._dietA=aid;try{S.db.doc("diet/"+aid).onSnapshot(d=>{S.diet={[aid]:d.exists?d.data():null};scheduleRender()},()=>{})}catch(e){}}
document.addEventListener("click",async e=>{const t=e.target.closest?.("[data-tgt],[data-fday],[data-fall],[data-fath],[data-fatt],[data-fnav],[data-infmove],[data-infign],[data-intladd],[data-nutsel],[data-pdg],[data-act=fclose],[data-act=nutriadd],[data-act=nutrisave],[data-act=dietsave],[data-act=clin],[data-act=clinback],[data-act=pdtoday],[data-act=pdtomorrow]");if(!t)return;const ds=t.dataset;e.stopPropagation();
  if(ds.tgt!=null){S.hand=!S.hand;ls.set("hand",S.hand);S._keepScroll=true;render();if(ED?.kind==="tile")openTile(ED.g,ED.w,ED.i);toast(S.hand?"Tempi manuali (−0,27 s)":"Tempi elettrici");return}
  if(ds.fday){let di=DAYS.indexOf(fieldDay())+(+ds.fday);if(di<0){if(S.week>1){S.week--;di=6}else di=0}else if(di>6){if(S.week<NW){S.week++;di=0}else di=6}S.fdi=di;render();return}
  if(ds.fall!=null){S.fAll=ds.fall==="1";render();return}
  if(ds.fath){openFath(ds.fath);return}
  if(ds.fatt){const aid=ds.aid,w=S.week,d=fieldDay();const cur=dayLog(logFor(aid),w,d)?.att||null;setAtt(aid,w,d,cur===ds.fatt?null:ds.fatt);return}
  if(ds.fnav){const L=ED?.list||[];const i=L.indexOf(ED.aid)+(+ds.fnav);if(i>=0&&i<L.length){ED.aid=L[i];fathRefresh()}return}
  if(ds.infmove){const [aid,dir]=ds.infmove.split("|");infMove(aid,dir);return}
  if(ds.infign){const [aid,dir]=ds.infign.split("|");infIgnore(aid,dir);return}
  if(ds.intladd!=null){intlAdd(+ds.intladd);return}
  if(ds.nutsel!=null){S.nutSel=ds.nutsel||null;render();window.scrollTo(0,0);return}
  if(ds.pdg!=null){S.pdG=ds.pdg||null;render();return}
  const a=ds.act;
  if(a==="fclose"){const w=S.week,d=fieldDay();const L=fieldList().filter(([id])=>dayRowsOf(id,w,d).length&&!attOf(id,w,d));for(const [id] of L)await setAtt(id,w,d,"a");toast(`${L.length} segnati assenti`);return}
  if(a==="nutriadd"){openNutriAdd(ds.aid);return}if(a==="nutrisave"){nutriSave();return}if(a==="dietsave"){dietSave(ds.aid);return}
  if(a==="clin"){S.clinAid=ds.aid;S.tab="clin";render();window.scrollTo(0,0);return}if(a==="clinback"){S.tab="ath";S.athSel=S.clinAid;S.folder=S.clinAid;render();return}
  if(a==="pdtoday"||a==="pdtomorrow"){const t2=new Date();if(a==="pdtomorrow")t2.setDate(t2.getDate()+1);const {w,d}=wdOf(t2);S.pd={w:Math.min(NW,Math.max(1,w)),d};S.tab="print";render();window.scrollTo(0,0);return}},true);
document.addEventListener("change",e=>{const t=e.target;if(t.id==="pd_wx"){S.pdNoWx=!t.checked;render()}else if(t.id==="pd_nt"){S.pdNoNotes=!t.checked;render()}});

/* ---- v40 · navigazione: indietro, home, oggi, giorni a scorrimento, trascina per aggiornare ---- */
const NAVK=["tab","cal","group","week","athSel","repAth","folder"];
const NAV={last:null,d:0,pop:false};let SHEETH=false;
function navSnap(){return JSON.stringify(NAVK.map(k=>S[k]??null))}
function updBack(){const b=$("#navback");if(b)b.hidden=!(NAV.d>0)}
function sheetHist(){if(SHEETH||NAV.last==null)return;SHEETH=true;NAV.d++;try{history.pushState({nav:NAV.last,d:NAV.d,sheet:1},"")}catch(e){}updBack()}
function navAfter(){if(S.needLogin||!allReady())return;ensureMF();if(S._cw==null)S._cw=currentWeek();const k=navSnap();
  if(NAV.last==null){NAV.d=0;try{history.replaceState({nav:k,d:0,root:1},"")}catch(e){}}
  else if(k!==NAV.last&&!NAV.pop){const a=JSON.parse(NAV.last),b=JSON.parse(k);const onlyWeek=NAVK.every((x,i)=>x==="week"||a[i]===b[i]);
    try{if(onlyWeek)history.replaceState({...(history.state||{}),nav:k},"");else{NAV.d++;history.pushState({nav:k,d:NAV.d},"")}}catch(e){}}
  NAV.last=k;NAV.pop=false;updBack()}
window.addEventListener("popstate",e=>{const st=e.state||{};
  if(typeof st.d==="number")NAV.d=st.d;
  if($("#sheet").innerHTML){closeSheet(true);updBack();return}
  if(!st.nav){updBack();return}
  if(st.nav===NAV.last){if(!st.root)history.back();updBack();return}
  const v=JSON.parse(st.nav);NAVK.forEach((k,i)=>{S[k]=v[i]});ls.set("tab",S.tab);if(S.group)ls.set("group",S.group);if(S.cal)ls.set("cal",S.cal);
  NAV.pop=true;NAV.last=st.nav;render();window.scrollTo(0,0)});
function ensureMF(){if(S._mfTried||!S.coach||!S.canWrite||!S.cfg||S.cfg.mfInit||S.noDb)return;S._mfTried=true;const cfg=clone(S.cfg);cfg.cgroups=cfg.cgroups||{};
  if(!Object.values(cfg.cgroups).some(c=>c&&c.km)){let id="mezzofondo",n=2;while(cfg.cgroups[id])id="mezzofondo-"+(n++);cfg.cgroups[id]={name:"Mezzofondo",note:"volumi in km",color:"#2E7D32",base:"400",order:Object.keys(cfg.cgroups).length,km:true}}
  cfg.mfInit=true;setTimeout(()=>saveCfg(cfg),0)}
function wuName(t){const s=String(t||"").trim();const m=s.match(/^(warm[- ]?up[^:\n•]{0,40})/i);if(m)return m[1].replace(/\s*\($/,"").trim();const m2=s.match(/^([A-Za-zÀ-ÿ' ]{3,28}):/);return m2?"Warm-up · "+m2[1].trim():"Warm-up"}
function wuTile(wu,attrs){return `<button class="wutile" ${attrs}><span class="sysdot" style="background:#E8590C;width:28px;height:28px;border-radius:7px">🔥</span><span class="wtx"><b>${esc(wuName(wu))}</b><span class="small muted">${esc(String(wu).replace(/\s+/g," ").slice(0,70))}…</span></span><i>›</i></button>`}
function openWU(w,d,g){const doc=weekDoc(w,g);const wu=doc.wu?.[d]||"";const ro=!S.canWrite;
  openSheet(`<h2>🔥 ${esc(wuName(wu))}</h2><div class="small muted" style="margin:-6px 0 10px">${DAYFULL[DAYS.indexOf(d)]} ${dshort(dateOf(w,DAYS.indexOf(d)))} · ${esc(keyLabel(g))}</div><div class="wufull">${esc(wu).replace(/\s*•\s*/g,"<br>• ")}</div>
  <div class="actions">${ro?"":`<button class="btn" data-dayedit="${d}" data-w="${w}" data-g="${esc(g)}">✎ Modifica</button>`}<button class="btn primary" data-sheet="close">Chiudi</button></div>`)}
function goDay(aid,w,d){if($("#sheet").innerHTML)closeSheet();const a=S.athletes[aid];w=+w;S.tab="cal";S.cal="week";ls.set("cal","week");ls.set("tab","cal");if(a){S.group=a.group;ls.set("group",a.group);S.ath[a.group]=aid;ls.set("ath",S.ath)}S.athSel=null;S.repAth=null;S.folder=null;S.week=Math.min(NW,Math.max(1,w));S._colTo=DAYS.indexOf(d);render();window.scrollTo(0,0)}
function goHome(){if($("#sheet").innerHTML)closeSheet();S.tab=S.coach?"cal":"week";if(S.coach){S.cal="week";ls.set("cal","week")}S.athSel=null;S.repAth=null;S.folder=null;S.week=currentWeek();S._aday=todayIdx(S.week);S._colTo=todayIdx(S.week);ls.set("tab",S.tab);render();window.scrollTo(0,0)}
function swCenter(sw,el,smooth){if(!sw||!el)return;const x=el.offsetLeft-(sw.clientWidth-el.clientWidth)/2;if(smooth)sw.scrollTo({left:x,behavior:"smooth"});else sw.scrollLeft=x}
function stripSync(){const sw=$("#aswipe");if(!sw)return;const cs=[...sw.children];if(!cs.length)return;const mid=sw.scrollLeft+sw.clientWidth/2;let best=cs[0];for(const c of cs)if(Math.abs(c.offsetLeft+c.clientWidth/2-mid)<Math.abs(best.offsetLeft+best.clientWidth/2-mid))best=c;
  const di=best.dataset.di;document.querySelectorAll(".daystrip button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.aday===di)))}
function foldTools(){document.querySelectorAll(".wkhead").forEach(card=>{if(card.querySelector("details.wtools"))return;const parts=[...card.querySelectorAll(".wt-btns,.wt-per,.wt-lbl,.wt-note")];if(!parts.length)return;
  const d=document.createElement("details");d.className="wtools noprint";d.open=!!S._wtOpen;d.innerHTML="<summary>⚙︎ Strumenti, ciclo e note della settimana</summary>";parts.forEach(x=>d.appendChild(x));const b=card.querySelector(".bar");if(b)b.after(d);else card.prepend(d);d.addEventListener("toggle",()=>{S._wtOpen=d.open})})}
function postNav(ax,aw){navAfter();foldTools();
  const sw=$("#aswipe");if(sw){const cur=S.week;if(S._aday==null&&aw===cur&&ax!=null)sw.scrollLeft=ax;else{const ti=todayIdx(cur);const want=S._aday!=null?S._aday:(ti>=0?ti:null);const el=want!=null?sw.querySelector(`[data-di="${want}"]`):null;if(el)swCenter(sw,el,false);else sw.scrollLeft=0}
    S._aday=null;S._swW=cur;let tm=null;sw.onscroll=()=>{clearTimeout(tm);tm=setTimeout(stripSync,60)};stripSync()}
  if(S._colTo!=null){const b=document.querySelector(".boardwrap");const col=b?.querySelectorAll(".col")[S._colTo];if(b&&col&&b.scrollWidth>b.clientWidth)b.scrollLeft=col.offsetLeft-16;S._colTo=null}}
document.addEventListener("click",e=>{const t=e.target.closest?.("#navback,#navhome,#navhomeb,[data-aday],[data-dnav]");if(!t)return;
  if(t.id==="navback"){e.stopPropagation();history.back();return}
  if(t.id==="navhome"||t.id==="navhomeb"){e.stopPropagation();goHome();return}
  if(t.dataset.aday!=null){e.stopPropagation();const sw=$("#aswipe");swCenter(sw,sw?.querySelector(`[data-di="${t.dataset.aday}"]`),true);return}
  if(t.dataset.dnav!=null){e.stopPropagation();const b=t.closest(".boardwrap");const cols=b?[...b.querySelectorAll(".col")]:[];const i=+t.dataset.di+(+t.dataset.dnav);
    if(i<0){if(S.week>1){S.week--;S._colTo=6;render()}return}if(i>6){if(S.week<NW){S.week++;S._colTo=0;render()}return}
    const c=cols[i];if(b&&c)b.scrollTo({left:c.offsetLeft-16,behavior:"smooth"});return}},true);
document.addEventListener("click",e=>{const b=e.target.closest?.("#side [data-tab],#side [data-cal],#side [data-wcount],#side [data-mcount],#side [data-act=selmode],#side [data-act=pasteon],#side [data-act=account],#side [data-act=pdtoday],#side [data-act=pdtomorrow],#side [data-sidea]");if(b)setTimeout(()=>document.body.classList.remove("sideopen"),0)},true);
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.id==="navhome"){e.preventDefault();goHome()}});
document.addEventListener("visibilitychange",()=>{if(document.hidden||!allReady())return;const cw=currentWeek();if(S._cw!=null&&cw!==S._cw&&S.week===S._cw){S.week=cw;S._aday=todayIdx(cw)}S._cw=cw;S._keepScroll=true;render()});
(function(){const sa=(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||navigator.standalone;if(!sa)return;let y0=null,x0=0,dy=0;const el=document.createElement("div");el.id="ptr";el.textContent="↓ Trascina per aggiornare";document.body.appendChild(el);
  const hide=()=>{el.style.transform="translate(-50%,-60px)"};
  document.addEventListener("touchstart",e=>{if(window.scrollY>2||$("#sheet").innerHTML||e.touches.length>1||e.target.closest?.("#side")){y0=null;return}y0=e.touches[0].clientY;x0=e.touches[0].clientX;dy=0},{passive:true});
  document.addEventListener("touchmove",e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;const dx=Math.abs(e.touches[0].clientX-x0);if(dy<0||dx>dy){hide();return}el.style.transform=`translate(-50%,${Math.min(dy,120)/2-20}px)`;el.textContent=dy>90?"↻ Rilascia per aggiornare":"↓ Trascina per aggiornare"},{passive:true});
  document.addEventListener("touchend",()=>{if(y0!=null&&dy>90){el.textContent="Aggiornamento…";setTimeout(()=>location.reload(),80)}else hide();y0=null;dy=0},{passive:true})})();
render();boot();
</script>
